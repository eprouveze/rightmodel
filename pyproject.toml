[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rightmodel"
version = "0.1.0"
description = "Earn-as-you-route model selection: a taint/availability/capability/cost cascade, a multi-provider council, and a falsifiable outcome ledger that earns autonomy per model and task-class."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emmanuel Prouveze" }]
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rightmodel = "rightmodel.rightmodel_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
